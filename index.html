<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #1f2328;
      --muted: #6e7781;
      --border: #d0d7de;
      --line: #e6e8eb;
      --accent: #0969da;
      --work: #0969da;
      --personal: #1a7f37;
      --study: #bc4c00;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      line-height: 1.5;
    }

    .app {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.5rem;
    }

    input[type="text"],
    select,
    button {
      font: inherit;
      color: inherit;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
    }

    button {
      cursor: pointer;
    }

    button:hover {
      background: var(--bg);
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* 헤더: 날짜 이동과 진행률 */
    .date-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #current-date {
      flex: 1;
      text-align: center;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .progress {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 12px 0 16px;
    }

    .progress-bar {
      flex: 1;
      height: 10px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }

    #progress-fill {
      width: 0;
      height: 100%;
      background: var(--accent);
      transition: width 0.2s;
    }

    #progress-text {
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* 입력줄 */
    #add-form {
      display: flex;
      gap: 8px;
    }

    #new-text {
      flex: 1;
      min-width: 0;
    }

    #add-form button[type="submit"] {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    /* 필터 탭 */
    #filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 16px 0 8px;
    }

    #filters button {
      padding: 4px 14px;
      border-radius: 999px;
    }

    #filters button.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    /* 목록 */
    #task-list {
      margin: 0;
      padding: 0;
      list-style: none;
      background: var(--surface);
      border-radius: 8px;
    }

    .task {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }

    .task:last-child {
      border-bottom: none;
    }

    .task-text,
    .edit-text {
      flex: 1 1 120px;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .task.done .task-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .badge {
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      color: #ffffff;
      white-space: nowrap;
    }

    .badge-work {
      background: var(--work);
    }

    .badge-personal {
      background: var(--personal);
    }

    .badge-study {
      background: var(--study);
    }

    /* 버튼 묶음은 함께 줄바꿈되고 오른쪽에 붙는다 */
    .actions {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }

    .task button {
      padding: 2px 8px;
      font-size: 0.875rem;
    }

    #empty-message {
      margin: 0;
      padding: 24px 0;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>할 일</h1>
      <div class="date-nav">
        <button type="button" id="prev-day" aria-label="이전 날">◀</button>
        <span id="current-date"></span>
        <button type="button" id="next-day" aria-label="다음 날">▶</button>
        <button type="button" id="today-btn">오늘</button>
      </div>
      <div class="progress">
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <span id="progress-text"></span>
      </div>
    </header>

    <form id="add-form">
      <input id="new-text" type="text" placeholder="할 일을 입력하세요" aria-label="할 일" autocomplete="off">
      <select id="new-category" aria-label="카테고리">
        <option value="work">업무</option>
        <option value="personal">개인</option>
        <option value="study">공부</option>
      </select>
      <button type="submit">추가</button>
    </form>

    <nav id="filters" aria-label="카테고리 필터">
      <button type="button" data-filter="all">전체</button>
      <button type="button" data-filter="work">업무</button>
      <button type="button" data-filter="personal">개인</button>
      <button type="button" data-filter="study">공부</button>
    </nav>

    <ul id="task-list"></ul>
    <p id="empty-message"></p>
  </main>

  <script>
    // ===== 상수 =====
    const STORAGE_KEY = "todoApp.v1";
    const CATEGORY_LABELS = { work: "업무", personal: "개인", study: "공부" };
    const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];

    // ===== 날짜 =====
    // toISOString()은 UTC 기준이라 쓰지 않고, 로컬 연·월·일로 "YYYY-MM-DD"를 만든다.
    function toDateString(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function todayString() {
      return toDateString(new Date());
    }

    function addDays(dateStr, n) {
      const [y, m, d] = dateStr.split("-").map(Number);
      return toDateString(new Date(y, m - 1, d + n));
    }

    function formatDate(dateStr) {
      const [y, m, d] = dateStr.split("-").map(Number);
      return `${dateStr} (${WEEKDAYS[new Date(y, m - 1, d).getDay()]})`;
    }

    // ===== 저장 =====
    function loadTasks() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return data && Array.isArray(data.tasks) ? data.tasks : [];
      } catch (e) {
        return [];
      }
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 1, tasks: state.tasks }));
    }

    // ===== 상태 =====
    const state = {
      tasks: [],
      selectedDate: "",
      filter: "all",
      editingId: null
    };

    // 데이터가 바뀌는 모든 동작은 이 함수로 마무리한다: 저장 → 다시 그리기
    function commit() {
      saveTasks();
      render();
    }

    // ===== 변경 =====
    function createId() {
      return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
    }

    function addTask(text, category) {
      const trimmed = text.trim();
      if (!trimmed) return false;
      state.tasks.push({
        id: createId(),
        text: trimmed,
        category,
        done: false,
        date: state.selectedDate,
        createdAt: Date.now()
      });
      commit();
      return true;
    }

    function updateTask(id, text, category) {
      const trimmed = text.trim();
      if (!trimmed) return false;
      const task = state.tasks.find(t => t.id === id);
      if (!task) return false;
      task.text = trimmed;
      task.category = category;
      state.editingId = null;
      commit();
      return true;
    }

    function toggleTask(id) {
      const task = state.tasks.find(t => t.id === id);
      if (!task) return;
      task.done = !task.done;
      commit();
    }

    function moveToToday(id) {
      const task = state.tasks.find(t => t.id === id);
      if (!task) return;
      task.date = todayString();
      commit();
    }

    function deleteTask(id) {
      state.tasks = state.tasks.filter(t => t.id !== id);
      commit();
    }

    // ===== 화면 상태 (저장하지 않음) =====
    function changeDate(dateStr) {
      state.selectedDate = dateStr;
      state.editingId = null;
      render();
    }

    function changeFilter(filter) {
      state.filter = filter;
      state.editingId = null;
      render();
    }

    // ===== 조회 =====
    // 목록과 진행률이 모두 이 결과를 쓴다: 보고 있는 날짜 + 선택한 필터
    function getVisibleTasks() {
      return state.tasks
        .filter(t => t.date === state.selectedDate)
        .filter(t => state.filter === "all" || t.category === state.filter)
        .sort((a, b) => a.createdAt - b.createdAt);
    }

    function getProgress(tasks) {
      const total = tasks.length;
      const done = tasks.filter(t => t.done).length;
      const percent = total === 0 ? 0 : Math.round(done / total * 100);
      return { done, total, percent };
    }

    // ===== 그리기 =====
    const els = {
      currentDate: document.getElementById("current-date"),
      progressFill: document.getElementById("progress-fill"),
      progressText: document.getElementById("progress-text"),
      addForm: document.getElementById("add-form"),
      newText: document.getElementById("new-text"),
      newCategory: document.getElementById("new-category"),
      filters: document.getElementById("filters"),
      taskList: document.getElementById("task-list"),
      emptyMessage: document.getElementById("empty-message")
    };

    function render() {
      renderHeader();
      renderFilters();
      renderList();
    }

    function renderHeader() {
      const { done, total, percent } = getProgress(getVisibleTasks());
      els.currentDate.textContent = formatDate(state.selectedDate);
      els.progressFill.style.width = percent + "%";
      els.progressText.textContent = `${done} / ${total} (${percent}%)`;
    }

    function renderFilters() {
      for (const button of els.filters.querySelectorAll("[data-filter]")) {
        const active = button.dataset.filter === state.filter;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      }
    }

    function renderList() {
      // 목록을 새로 만들면 포커스가 사라지므로, 포커스가 있던 줄과 버튼을 기억해 두었다가 되돌린다
      const focused = els.taskList.contains(document.activeElement) ? document.activeElement : null;
      const focusedId = focused && focused.closest("li").dataset.id;
      const focusedAction = focused && focused.dataset.action;

      const tasks = getVisibleTasks();
      els.taskList.replaceChildren(...tasks.map(task =>
        task.id === state.editingId ? createEditItem(task) : createTaskItem(task)
      ));

      const editInput = els.taskList.querySelector(".edit-text");
      if (editInput) {
        editInput.focus();
      } else if (focusedId) {
        const li = [...els.taskList.children].find(item => item.dataset.id === focusedId);
        const target = li && (li.querySelector(`[data-action="${focusedAction}"]`) || li.querySelector('[data-action="edit"]'));
        if (target) target.focus();
      }

      els.emptyMessage.hidden = tasks.length > 0;
      els.emptyMessage.textContent = state.filter === "all"
        ? "이 날의 할 일이 없습니다. 위에서 추가해 보세요."
        : "이 카테고리에는 할 일이 없습니다.";
    }

    function createButton(label, action) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.dataset.action = action;
      return button;
    }

    function createTaskItem(task) {
      const li = document.createElement("li");
      li.className = "task" + (task.done ? " done" : "");
      li.dataset.id = task.id;

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = task.done;
      checkbox.dataset.action = "toggle";
      checkbox.setAttribute("aria-label", "완료");

      const text = document.createElement("span");
      text.className = "task-text";
      text.textContent = task.text;

      const badge = document.createElement("span");
      badge.className = "badge badge-" + task.category;
      badge.textContent = CATEGORY_LABELS[task.category];

      const actions = document.createElement("span");
      actions.className = "actions";
      // 오늘보다 이전 날짜의 미완료 항목만 오늘로 옮길 수 있다 ("YYYY-MM-DD"는 문자열 비교로 앞뒤를 가린다)
      if (!task.done && task.date < todayString()) {
        actions.append(createButton("오늘로", "move-today"));
      }
      actions.append(createButton("수정", "edit"), createButton("삭제", "delete"));

      li.append(checkbox, text, badge, actions);
      return li;
    }

    function createEditItem(task) {
      const li = document.createElement("li");
      li.className = "task editing";
      li.dataset.id = task.id;

      const input = document.createElement("input");
      input.type = "text";
      input.className = "edit-text";
      input.value = task.text;
      input.setAttribute("aria-label", "할 일 수정");

      const select = document.createElement("select");
      select.className = "edit-category";
      select.setAttribute("aria-label", "카테고리");
      for (const [value, label] of Object.entries(CATEGORY_LABELS)) {
        select.add(new Option(label, value));
      }
      select.value = task.category;

      const actions = document.createElement("span");
      actions.className = "actions";
      actions.append(createButton("저장", "save"), createButton("취소", "cancel"));

      li.append(input, select, actions);
      return li;
    }

    function saveEdit(li) {
      updateTask(li.dataset.id, li.querySelector(".edit-text").value, li.querySelector(".edit-category").value);
    }

    function cancelEdit() {
      state.editingId = null;
      render();
    }

    // ===== 이벤트 =====
    function bindEvents() {
      document.getElementById("prev-day").addEventListener("click", () => changeDate(addDays(state.selectedDate, -1)));
      document.getElementById("next-day").addEventListener("click", () => changeDate(addDays(state.selectedDate, 1)));
      document.getElementById("today-btn").addEventListener("click", () => changeDate(todayString()));

      els.filters.addEventListener("click", e => {
        const button = e.target.closest("[data-filter]");
        if (button) changeFilter(button.dataset.filter);
      });

      // 버튼 클릭과 Enter가 같은 submit 경로로 들어온다
      els.addForm.addEventListener("submit", e => {
        e.preventDefault();
        if (addTask(els.newText.value, els.newCategory.value)) {
          els.newText.value = "";
        }
        els.newText.focus();
      });

      // 목록은 다시 그릴 때마다 새로 만들어지므로 <ul> 한 곳에서 받는다
      els.taskList.addEventListener("change", e => {
        const li = e.target.closest("li");
        if (li && e.target.dataset.action === "toggle") toggleTask(li.dataset.id);
      });

      els.taskList.addEventListener("click", e => {
        const button = e.target.closest("button[data-action]");
        if (!button) return;
        const li = button.closest("li");
        const id = li.dataset.id;
        switch (button.dataset.action) {
          case "edit":
            state.editingId = id;
            render();
            break;
          case "save":
            saveEdit(li);
            break;
          case "cancel":
            cancelEdit();
            break;
          case "delete":
            if (confirm("삭제할까요?")) deleteTask(id);
            break;
          case "move-today":
            moveToToday(id);
            break;
        }
      });

      els.taskList.addEventListener("keydown", e => {
        // 한글 조합 중 Enter는 글자를 확정하는 입력이라 저장으로 보지 않는다
        if (!e.target.classList.contains("edit-text") || e.isComposing) return;
        if (e.key === "Enter") {
          // 저장 뒤 포커스가 [수정] 버튼으로 옮겨 가므로, 같은 Enter가 그 버튼을 누르지 않게 막는다
          e.preventDefault();
          saveEdit(e.target.closest("li"));
        }
        if (e.key === "Escape") {
          e.preventDefault();
          cancelEdit();
        }
      });
    }

    // ===== 시작 =====
    function init() {
      state.tasks = loadTasks();
      state.selectedDate = todayString();
      bindEvents();
      render();
    }

    init();
  </script>
</body>
</html>
