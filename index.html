<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    }

    .app {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px;
    }

    .task.done .task-text {
      text-decoration: line-through;
      color: #6e7781;
    }

    .progress-bar {
      height: 10px;
      background: #e6e8eb;
    }

    #progress-fill {
      height: 100%;
      background: #2da44e;
    }

    #filters button.active {
      background: #1f2328;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>할 일</h1>
      <div class="date-nav">
        <button type="button" id="prev-day" aria-label="이전 날">◀</button>
        <span id="current-date"></span>
        <button type="button" id="next-day" aria-label="다음 날">▶</button>
        <button type="button" id="today-btn">오늘</button>
      </div>
      <div class="progress">
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <span id="progress-text"></span>
      </div>
    </header>

    <form id="add-form">
      <input id="new-text" type="text" placeholder="할 일을 입력하세요" aria-label="할 일" autocomplete="off">
      <select id="new-category" aria-label="카테고리">
        <option value="work">업무</option>
        <option value="personal">개인</option>
        <option value="study">공부</option>
      </select>
      <button type="submit">추가</button>
    </form>

    <nav id="filters" aria-label="카테고리 필터">
      <button type="button" data-filter="all">전체</button>
      <button type="button" data-filter="work">업무</button>
      <button type="button" data-filter="personal">개인</button>
      <button type="button" data-filter="study">공부</button>
    </nav>

    <ul id="task-list"></ul>
    <p id="empty-message"></p>
  </main>

  <script>
    // ===== 상수 =====
    const STORAGE_KEY = "todoApp.v1";
    const CATEGORY_LABELS = { work: "업무", personal: "개인", study: "공부" };
    const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];

    // ===== 날짜 =====
    // toISOString()은 UTC 기준이라 쓰지 않고, 로컬 연·월·일로 "YYYY-MM-DD"를 만든다.
    function toDateString(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function todayString() {
      return toDateString(new Date());
    }

    function addDays(dateStr, n) {
      const [y, m, d] = dateStr.split("-").map(Number);
      return toDateString(new Date(y, m - 1, d + n));
    }

    function formatDate(dateStr) {
      const [y, m, d] = dateStr.split("-").map(Number);
      return `${dateStr} (${WEEKDAYS[new Date(y, m - 1, d).getDay()]})`;
    }

    // ===== 저장 =====
    function loadTasks() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return data && Array.isArray(data.tasks) ? data.tasks : [];
      } catch (e) {
        return [];
      }
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 1, tasks: state.tasks }));
    }

    // ===== 상태 =====
    const state = {
      tasks: [],
      selectedDate: "",
      filter: "all",
      editingId: null
    };

    // 데이터가 바뀌는 모든 동작은 이 함수로 마무리한다: 저장 → 다시 그리기
    function commit() {
      saveTasks();
      render();
    }

    // ===== 변경 =====
    function createId() {
      return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
    }

    function addTask(text, category) {
      const trimmed = text.trim();
      if (!trimmed) return false;
      state.tasks.push({
        id: createId(),
        text: trimmed,
        category,
        done: false,
        date: state.selectedDate,
        createdAt: Date.now()
      });
      commit();
      return true;
    }

    function toggleTask(id) {
      const task = state.tasks.find(t => t.id === id);
      if (!task) return;
      task.done = !task.done;
      commit();
    }

    function deleteTask(id) {
      state.tasks = state.tasks.filter(t => t.id !== id);
      commit();
    }

    // ===== 화면 상태 (저장하지 않음) =====
    function changeDate(dateStr) {
      state.selectedDate = dateStr;
      state.editingId = null;
      render();
    }

    function changeFilter(filter) {
      state.filter = filter;
      state.editingId = null;
      render();
    }

    // ===== 조회 =====
    // 목록과 진행률이 모두 이 결과를 쓴다: 보고 있는 날짜 + 선택한 필터
    function getVisibleTasks() {
      return state.tasks
        .filter(t => t.date === state.selectedDate)
        .filter(t => state.filter === "all" || t.category === state.filter)
        .sort((a, b) => a.createdAt - b.createdAt);
    }

    function getProgress(tasks) {
      const total = tasks.length;
      const done = tasks.filter(t => t.done).length;
      const percent = total === 0 ? 0 : Math.round(done / total * 100);
      return { done, total, percent };
    }

    // ===== 그리기 =====
    const els = {
      currentDate: document.getElementById("current-date"),
      progressFill: document.getElementById("progress-fill"),
      progressText: document.getElementById("progress-text"),
      addForm: document.getElementById("add-form"),
      newText: document.getElementById("new-text"),
      newCategory: document.getElementById("new-category"),
      filters: document.getElementById("filters"),
      taskList: document.getElementById("task-list"),
      emptyMessage: document.getElementById("empty-message")
    };

    function render() {
      renderHeader();
      renderFilters();
      renderList();
    }

    function renderHeader() {
      const { done, total, percent } = getProgress(getVisibleTasks());
      els.currentDate.textContent = formatDate(state.selectedDate);
      els.progressFill.style.width = percent + "%";
      els.progressText.textContent = `${done} / ${total} (${percent}%)`;
    }

    function renderFilters() {
      for (const button of els.filters.querySelectorAll("[data-filter]")) {
        const active = button.dataset.filter === state.filter;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      }
    }

    function renderList() {
      const tasks = getVisibleTasks();
      els.taskList.replaceChildren(...tasks.map(createTaskItem));

      els.emptyMessage.hidden = tasks.length > 0;
      els.emptyMessage.textContent = state.filter === "all"
        ? "이 날의 할 일이 없습니다. 위에서 추가해 보세요."
        : "이 카테고리에는 할 일이 없습니다.";
    }

    function createButton(label, action) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.dataset.action = action;
      return button;
    }

    function createTaskItem(task) {
      const li = document.createElement("li");
      li.className = "task" + (task.done ? " done" : "");
      li.dataset.id = task.id;

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = task.done;
      checkbox.dataset.action = "toggle";
      checkbox.setAttribute("aria-label", "완료");

      const text = document.createElement("span");
      text.className = "task-text";
      text.textContent = task.text;

      const badge = document.createElement("span");
      badge.className = "badge badge-" + task.category;
      badge.textContent = CATEGORY_LABELS[task.category];

      li.append(checkbox, text, badge, createButton("수정", "edit"), createButton("삭제", "delete"));
      return li;
    }

    // ===== 이벤트 =====
    function bindEvents() {
      document.getElementById("prev-day").addEventListener("click", () => changeDate(addDays(state.selectedDate, -1)));
      document.getElementById("next-day").addEventListener("click", () => changeDate(addDays(state.selectedDate, 1)));
      document.getElementById("today-btn").addEventListener("click", () => changeDate(todayString()));

      els.filters.addEventListener("click", e => {
        const button = e.target.closest("[data-filter]");
        if (button) changeFilter(button.dataset.filter);
      });

      // 버튼 클릭과 Enter가 같은 submit 경로로 들어온다
      els.addForm.addEventListener("submit", e => {
        e.preventDefault();
        if (addTask(els.newText.value, els.newCategory.value)) {
          els.newText.value = "";
        }
        els.newText.focus();
      });

      // 목록은 다시 그릴 때마다 새로 만들어지므로 <ul> 한 곳에서 받는다
      els.taskList.addEventListener("change", e => {
        const li = e.target.closest("li");
        if (li && e.target.dataset.action === "toggle") toggleTask(li.dataset.id);
      });

      els.taskList.addEventListener("click", e => {
        const button = e.target.closest("button[data-action]");
        if (!button) return;
        const id = button.closest("li").dataset.id;
        switch (button.dataset.action) {
          case "delete":
            if (confirm("삭제할까요?")) deleteTask(id);
            break;
        }
      });
    }

    // ===== 시작 =====
    function init() {
      state.tasks = loadTasks();
      state.selectedDate = todayString();
      bindEvents();
      render();
    }

    init();
  </script>
</body>
</html>
